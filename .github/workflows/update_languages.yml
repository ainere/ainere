name: Update Language Stats

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate languages.svg
        if: "${{ secrets.PAT_TOKEN != '' }}"
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python .github/scripts/update_languages.py

      - name: Commit and push if changed
        if: "${{ secrets.PAT_TOKEN != '' }}"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/terminal_toolbox.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(stats): update language statistics [skip ci]" && git push)
