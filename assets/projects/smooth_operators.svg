<svg xmlns="http://www.w3.org/2000/svg" width="740" height="148" viewBox="0 0 740 148">
  <style>
    .card-bg { fill: #161b22; stroke: #30363d; }
    .title-text { fill: #ffffff; }
    .sub-text { fill: #8b949e; }
    .body-text { fill: #c9d1d9; }
    .footer-text { fill: #8b949e; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #ffffff; stroke: #d0d7de; }
      .title-text { fill: #1f2328; }
      .sub-text { fill: #656d76; }
      .body-text { fill: #1f2328; }
      .footer-text { fill: #656d76; }
    }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="739" height="147" rx="8" ry="8" class="card-bg" stroke-width="1"/>

  <!-- Pill Badge: Coursework · Private -->
  <g transform="translate(588, 14)">
    <rect x="0.5" y="0.5" width="132" height="21" rx="10.5" fill="#334155" fill-opacity="0.30" stroke="#475569" stroke-opacity="0.6" stroke-width="1"/>
    <text x="66" y="14.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Coursework · Private</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" class="title-text">Smooth Operators</text>
  <text x="20" y="47" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="sub-text">Logistics Tracker</text>

  <!-- Description -->
  <text x="20" y="71" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="body-text">
    <tspan x="20" dy="0">A desktop logistics and dispatch management platform built for database systems coursework. Features</tspan>
    <tspan x="20" dy="18">automated delivery route calculation with dynamic distance-based pricing integrated via the Google Maps API,</tspan>
    <tspan x="20" dy="18">alongside role-based operational dashboards tailored for fleet dispatchers and administrators.</tspan>
  </text>

  <!-- Footer -->
  <text x="20" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" class="footer-text">Java · JavaFX · MySQL · JDBC · Google Maps API</text>
  <text x="720" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-style="italic" class="footer-text" text-anchor="end">(Academic repository)</text>
</svg>