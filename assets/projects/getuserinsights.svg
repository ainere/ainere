<svg xmlns="http://www.w3.org/2000/svg" width="580" height="152" viewBox="0 0 580 152">
  <style>
    .card-bg { fill: #161b22; stroke: #30363d; }
    .title-text { fill: #ffffff; }
    .sub-text { fill: #8b949e; }
    .body-text { fill: #c9d1d9; }
    .footer-text { fill: #8b949e; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #ffffff; stroke: #d0d7de; }
      .title-text { fill: #1f2328; }
      .sub-text { fill: #656d76; }
      .body-text { fill: #1f2328; }
      .footer-text { fill: #656d76; }
    }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="579" height="151" rx="8" ry="8" class="card-bg" stroke-width="1"/>

  <!-- Pill Badge: Client Project · Private -->
  <g transform="translate(427, 14)">
    <rect x="0.5" y="0.5" width="138" height="21" rx="10.5" fill="#334155" fill-opacity="0.30" stroke="#475569" stroke-opacity="0.6" stroke-width="1"/>
    <text x="69" y="14.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Client Project · Private</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="16" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" class="title-text">GetUserInsights</text>
  <text x="16" y="47" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="sub-text">Usability Audit Platform</text>

  <!-- Description -->
  <text x="16" y="69" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="body-text">
    <tspan x="16" dy="0">A usability analysis platform that helps product teams pinpoint conversion blockers</tspan>
    <tspan x="16" dy="17">without the overhead of manual user research. It automatically recruits targeted testers</tspan>
    <tspan x="16" dy="17">for think-aloud sessions, extracts exact video clips of user struggle, and synthesizes AI-</tspan>
    <tspan x="16" dy="17">driven audit reports with actionable design recommendations.</tspan>
  </text>

  <!-- Footer -->
  <text x="16" y="136" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" class="footer-text">Python · Flask · SQLite · Tailwind CSS</text>
  <text x="564" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-style="italic" class="footer-text" text-anchor="end">(Production deployment · Proprietary)</text>
</svg>