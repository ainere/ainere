<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="20" height="20" shape-rendering="crispEdges">
  <!-- Classic XP Workstation / User Icon (16x16 pixel art) -->
  <!-- Monitor Outer Bevel -->
  <rect x="1" y="1" width="14" height="11" fill="#D4D0C8"/>
  <path d="M1 1 H15 V2 H2 V11 H1 Z" fill="#FFFFFF"/>
  <path d="M15 1 V12 H1 V11 H14 V1 Z" fill="#808080"/>
  <rect x="0" y="0" width="16" height="1" fill="#000000" opacity="0.4"/>
  
  <!-- Monitor Screen (XP Bliss Blue) -->
  <rect x="3" y="3" width="10" height="7" fill="#1C68B8"/>
  <rect x="3" y="3" width="10" height="1" fill="#0A3C74"/>

  <!-- User Silhouette inside screen -->
  <!-- Head -->
  <rect x="7" y="4" width="2" height="2" fill="#FFE082"/>
  <!-- Body/Shoulders -->
  <rect x="6" y="7" width="4" height="2" fill="#FFFFFF"/>
  <rect x="5" y="8" width="6" height="2" fill="#FFFFFF"/>

  <!-- Monitor Stand & Base -->
  <rect x="7" y="12" width="2" height="1" fill="#808080"/>
  <rect x="5" y="13" width="6" height="2" fill="#D4D0C8"/>
  <path d="M5 13 H11 V14 H6 V15 H5 Z" fill="#FFFFFF"/>
  <path d="M11 13 V15 H5 V14 H10 V13 Z" fill="#404040"/>
  <rect x="4" y="15" width="8" height="1" fill="#000000"/>
</svg>
