<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="20" height="20" shape-rendering="crispEdges">
  <!-- Classic Windows Network / World Globe (16x16 pixel art) -->
  <!-- Globe Outer Border / Shading -->
  <rect x="5" y="1" width="6" height="14" fill="#1565C0"/>
  <rect x="3" y="2" width="10" height="12" fill="#1565C0"/>
  <rect x="2" y="3" width="12" height="10" fill="#1976D2"/>
  <rect x="1" y="5" width="14" height="6" fill="#1E88E5"/>

  <!-- Continents (Green 8-bit patches) -->
  <!-- North America / Eurasia -->
  <rect x="3" y="3" width="3" height="2" fill="#4CAF50"/>
  <rect x="4" y="5" width="4" height="2" fill="#4CAF50"/>
  <rect x="9" y="3" width="3" height="3" fill="#4CAF50"/>
  <rect x="11" y="6" width="2" height="2" fill="#4CAF50"/>
  <!-- Africa / South America -->
  <rect x="8" y="7" width="3" height="3" fill="#4CAF50"/>
  <rect x="4" y="9" width="2" height="3" fill="#4CAF50"/>
  <rect x="9" y="11" width="2" height="1" fill="#4CAF50"/>

  <!-- Latitude / Longitude lines (Light blue) -->
  <line x1="1" y1="8" x2="15" y2="8" stroke="#90CAF9" stroke-opacity="0.6"/>
  <line x1="8" y1="1" x2="8" y2="15" stroke="#90CAF9" stroke-opacity="0.6"/>

  <!-- Network Cable / Plug wrapping at bottom corner -->
  <rect x="11" y="12" width="4" height="3" fill="#FFC107"/>
  <rect x="14" y="13" width="2" height="1" fill="#FFA000"/>
</svg>
